plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.2'
    id 'io.spring.dependency-management' version '1.1.4'
    id "org.flywaydb.flyway" version "10.9.0"
    id "com.bmuschko.docker-remote-api" version "9.4.0"
    id "com.diffplug.spotless" version "7.0.3"
}

group = 'com.LetMeDoWith'
version = '0.0.1-SNAPSHOT'

spotless {
    java {
        // import 순서 정의
        importOrder(
                "java",
                "javax",
                "lombok",
                "org.springframework",
                "",
                "\\#",
                "org.junit",
                "\\#org.junit",
                "com.guide",
                "\\#com.guide"
        )
        // 사용하지 않는 import 제거
        removeUnusedImports()
        // 구글 자바 포맷 적용

        palantirJavaFormat()
        // 공백 제거
        trimTrailingWhitespace()
        // 끝부분 New Line 처리
        endWithNewline()
    }
}

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }


}

// 환경변수 설정
ext {
    awsSdkVersion = '2.27.21'
    awsCliProfile = System.getenv("AWS_CLI_PROFILE")
    dockerImageName = System.getenv("DOCKER_IMAGE_NAME")
    dockerImageTag = System.getenv("DOCKER_IMAGE_TAG")
    ecrRepository = System.getenv("ECR_REPOSITORY")
    awsRegion = System.getenv("AWS_REGION")
    deployPlatform = System.getenv("DEPLOY_PLATFORM")
}
repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
    testImplementation 'org.projectlombok:lombok:1.18.22'
    compileOnly 'org.projectlombok:lombok'
    implementation 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.3'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'

    // QueryDSL JPA
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:${dependencyManagement.importedProperties['querydsl.version']}:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // Jwt
    implementation group: 'io.jsonwebtoken', name: 'jjwt-api', version: '0.11.2'
    runtimeOnly group: 'io.jsonwebtoken', name: 'jjwt-impl', version: '0.11.2'
    runtimeOnly group: 'io.jsonwebtoken', name: 'jjwt-jackson', version: '0.11.2'

    // flyway
    implementation("org.flywaydb:flyway-core")
    implementation("org.flywaydb:flyway-mysql")

    // webClient
    implementation 'org.springframework.boot:spring-boot-starter-webflux:3.2.2'

    // redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis:3.2.3'

    // spring cache
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // for resolve error only causes in Apple Silicon Mac.
    implementation("io.netty:netty-resolver-dns-native-macos:4.1.75.Final:osx-aarch_64")

    // swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.2'
    annotationProcessor 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.2'


    implementation 'com.h2database:h2'
    testImplementation 'com.h2database:h2'

    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'io.hypersistence:hypersistence-utils-hibernate-63:3.9.10'

    // AWS SDK
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation "software.amazon.awssdk:s3"

    // Firebase Admin SDK
    implementation 'com.google.firebase:firebase-admin:9.5.0'

    // for logging
    implementation("com.github.gavlyukovskiy:datasource-proxy-spring-boot-starter:1.9.0")

    implementation("org.springframework.boot:spring-boot-starter-batch")

    testImplementation 'org.springframework.batch:spring-batch-test'


    // localStack for AWS
//    implementation "com.amazonaws:aws-java-sdk-s3"
//    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.783'
//    implementation 'org.testcontainers:localstack:1.21.0'
//    testImplementation 'org.testcontainers:junit-jupiter'

}


import com.bmuschko.gradle.docker.tasks.image.DockerBuildImage
import com.bmuschko.gradle.docker.tasks.image.DockerTagImage
import org.springframework.boot.gradle.tasks.bundling.BootJar
import org.springframework.boot.gradle.tasks.run.BootRun

// .env 파일 로드 함수
def loadEnv(String fileName) {
    def props = new Properties()
    def file = file(fileName)
    if (file.exists()) {
        file.withInputStream { stream ->
            props.load(stream)
        }
    }
    return props
}

// === API Docker Tasks ===
def apiEnv = loadEnv("docker-api.env")

tasks.register('buildApiDockerImage', DockerBuildImage) {
    group = "docker-api"
    dependsOn 'bootJarApi'
    inputDir = file(".")
    dockerFile = file("Dockerfile-api")
    // env 파일이 없으면 기본값 혹은 null (빌드 실패 가능성 있음)
    def imageName = apiEnv.getProperty('DOCKER_IMAGE_NAME', 'letmedowith/api')
    def imageTag = apiEnv.getProperty('DOCKER_IMAGE_TAG', 'api-latest')
    def platformVal = apiEnv.getProperty('DEPLOY_PLATFORM', 'linux/amd64')

    images.add(imageName + ":" + imageTag)
    platform = platformVal
}

tasks.register('tagApiDockerImage', DockerTagImage) {
    group = "docker-api"
    dependsOn buildApiDockerImage
    def imageName = apiEnv.getProperty('DOCKER_IMAGE_NAME', 'letmedowith/api')
    def imageTag = apiEnv.getProperty('DOCKER_IMAGE_TAG', 'api-latest')
    def repo = apiEnv.getProperty('ECR_REPOSITORY', '')

    imageId = imageName + ":" + imageTag
    repository = repo
    tag = imageTag
}

tasks.register('pushApiDockerImage') {
    group = "docker-api"
    dependsOn tagApiDockerImage
    doLast {
        def repo = apiEnv.getProperty('ECR_REPOSITORY')
        def tag = apiEnv.getProperty('DOCKER_IMAGE_TAG')
        def profile = apiEnv.getProperty('AWS_CLI_PROFILE')
        def region = apiEnv.getProperty('AWS_REGION')

        // ECR Login
        def loginCommand = "aws ecr get-login-password --profile " + profile + " --region " + region + " | docker login --username AWS --password-stdin " + repo
        exec {
            commandLine 'sh', '-c', loginCommand
        }

        // Push
        def pushCommand = "docker push " + repo + ":" + tag
        exec {
            commandLine 'sh', '-c', pushCommand
        }
    }
}


// === Batch Docker Tasks ===
def batchEnv = loadEnv("docker-batch.env")

tasks.register('buildBatchDockerImage', DockerBuildImage) {
    group = "docker-batch"
    dependsOn 'bootJarBatch'
    inputDir = file(".")
    dockerFile = file("Dockerfile-batch")

    def imageName = batchEnv.getProperty('DOCKER_IMAGE_NAME', 'letmedowith/batch')
    def imageTag = batchEnv.getProperty('DOCKER_IMAGE_TAG', 'batch-latest')
    def platformVal = batchEnv.getProperty('DEPLOY_PLATFORM', 'linux/amd64')

    images.add(imageName + ":" + imageTag)
    platform = platformVal
}

tasks.register('tagBatchDockerImage', DockerTagImage) {
    group = "docker-batch"
    dependsOn buildBatchDockerImage
    def imageName = batchEnv.getProperty('DOCKER_IMAGE_NAME', 'letmedowith/batch')
    def imageTag = batchEnv.getProperty('DOCKER_IMAGE_TAG', 'batch-latest')
    def repo = batchEnv.getProperty('ECR_REPOSITORY', '')

    imageId = imageName + ":" + imageTag
    repository = repo
    tag = imageTag
}

tasks.register('pushBatchDockerImage') {
    group = "docker-batch"
    dependsOn tagBatchDockerImage
    doLast {
        def repo = batchEnv.getProperty('ECR_REPOSITORY')
        def tag = batchEnv.getProperty('DOCKER_IMAGE_TAG')
        def profile = batchEnv.getProperty('AWS_CLI_PROFILE')
        def region = batchEnv.getProperty('AWS_REGION')

        // ECR Login
        def loginCommand = "aws ecr get-login-password --profile " + profile + " --region " + region + " | docker login --username AWS --password-stdin " + repo
        exec {
            commandLine 'sh', '-c', loginCommand
        }

        // Push
        def pushCommand = "docker push " + repo + ":" + tag
        exec {
            commandLine 'sh', '-c', pushCommand
        }
    }
}


test {
    useJUnitPlatform()

    // 모든 테스트 이벤트 로깅
    testLogging {
        events "passed", "skipped", "failed" // 성공, 스킵, 실패한 테스트 이벤트 로깅

        // 예외 메시지 출력
        showExceptions true // 예외 메시지 출력 활성화
        showCauses true // 예외 원인 출력 활성화
        showStackTraces true // 스택 트레이스 출력 활성화

        // 콘솔에 즉시 테스트 결과 표시
        showStandardStreams = true // 표준 출력 및 오류 스트림 표시
    }
}

tasks.test {

}

compileJava {
    dependsOn spotlessApply
    options.compilerArgs += ['-parameters']
}

springBoot {
    // bootJar/bootRun의 기본 main class는 API로 둔다.
    mainClass = 'com.LetMeDoWith.LetMeDoWith.LetMeDoWithApiApplication'
}

tasks.named('bootRun', BootRun) {
    mainClass.set('com.LetMeDoWith.LetMeDoWith.LetMeDoWithApiApplication')
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('bootRunApi', BootRun) {
    group = 'application'
    description = 'Run API application (port 8080)'
    mainClass.set('com.LetMeDoWith.LetMeDoWith.LetMeDoWithApiApplication')
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('bootRunBatch', BootRun) {
    group = 'application'
    description = 'Run Batch application (port 8081, scheduling enabled)'
    mainClass.set('com.LetMeDoWith.LetMeDoWith.LetMeDoWithBatchApplication')
    classpath = sourceSets.main.runtimeClasspath
}

tasks.named("bootJar") {
    enabled = false
}

tasks.register('bootJarApi', BootJar) {
    group = 'build'
    description = 'Builds the API executable JAR'
    mainClass = 'com.LetMeDoWith.LetMeDoWith.LetMeDoWithApiApplication'
    archiveClassifier = 'api'
    classpath = sourceSets.main.runtimeClasspath
    targetJavaVersion = java.sourceCompatibility
}

tasks.register('bootJarBatch', BootJar) {
    group = 'build'
    description = 'Builds the Batch executable JAR'
    mainClass = 'com.LetMeDoWith.LetMeDoWith.LetMeDoWithBatchApplication'
    archiveClassifier = 'batch'
    classpath = sourceSets.main.runtimeClasspath
    targetJavaVersion = java.sourceCompatibility
}