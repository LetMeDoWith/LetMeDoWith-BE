spring:
  profiles:
    default: local
    group:
      "local": "local, local-confidential"
      "dev": "dev, dev-confidential"
      "prod": "prod, prod-confidential"
      "test": "test, test-confidential"
  jackson:
    default-property-inclusion: always

server:
  port: 8080
  error:
    include-stacktrace: never

decorator:
  datasource:
    datasource-proxy:
      query:
        log-level: info
        logger-name: datasource-proxy
      format-sql: true

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/letmedowith_app
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    database: mysql
    hibernate:
      ddl-auto: validate
    generate-ddl: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    enabled: true
    url: jdbc:mysql://localhost:3306/letmedowith_app
  batch:
    jdbc:
      # TODO - 운영은 보통 'never'로 두고 DDL 미리 반영. 추후 정리 예정
      initialize-schema: always
    job:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_URL}:${DB_PORT}/${DB_SCHEMA}
    hikari:
      leak-detection-threshold: 20000
  #  data:
  #    redis:
  #      host: ${REDIS_URL}
  #      port: ${REDIS_PORT}
  jpa:
    database: mysql
    hibernate:
      ddl-auto: update
    generate-ddl: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    enabled: false
    url: jdbc:mysql://${DB_URL}:${DB_PORT}/${DB_SCHEMA}
  batch:
    jdbc:
      # TODO - 운영은 보통 'never'로 두고 DDL 미리 반영. 추후 정리 예정
      initialize-schema: always
    job:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_URL}:${DB_PORT}/${DB_SCHEMA}
  data:
    redis:
      host: ${REDIS_URL}
      port: ${REDIS_PORT}
  jpa:
    database: mysql
    hibernate:
      ddl-auto: update
    generate-ddl: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  batch:
    jdbc:
      # TODO - 운영은 보통 'never'로 두고 DDL 미리 반영. 추후 정리 예정
      initialize-schema: always
    job:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/letmedowith_test
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    database: mysql
    hibernate:
      ddl-auto: create-drop
    generate-ddl: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    enabled: false
    url: jdbc:mysql://localhost:3306/letmedowith_test
  batch:
    jdbc:
      # TODO - 운영은 보통 'never'로 두고 DDL 미리 반영. 추후 정리 예정
      initialize-schema: always
    job:
      enabled: false
